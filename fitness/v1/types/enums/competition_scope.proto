syntax = "proto3";

package fitness.v1.types.enums;

option go_package = "github.com/arm-1234/protos/fitness/v1/types/enums;enums";

// Geographic reach of a competition. Determines which leaderboard a user's
// sessions roll up into, and which users are allowed to join.
enum CompetitionScope {
  COMPETITION_SCOPE_UNSPECIFIED = 0;
  COMPETITION_SCOPE_NATIONAL = 1;
  COMPETITION_SCOPE_STATE = 2;
  COMPETITION_SCOPE_DISTRICT = 3;
}
