syntax = "proto3";

package clinic.v1.types;

import "google/protobuf/timestamp.proto";
import "clinic/v1/types/enums/service_category.proto";
import "clinic/v1/types/enums/consultation_mode.proto";

option go_package = "github.com/arm-1234/protos/clinic/v1/types;types";

message ServiceInfo {
  string service_id = 1;
  string slug = 2;
  string name = 3;
  string short_code = 4;
  clinic.v1.types.enums.ServiceCategory category = 5;
  string summary = 6;
  string description = 7;
  repeated string preparation_steps = 8;
  int32 duration_minutes = 9;
  int64 price_amount = 10;
  string currency = 11;
  repeated clinic.v1.types.enums.ConsultationMode supported_modes = 12;
  string image_url = 13;
  string icon = 14;
  bool is_featured = 15;
  bool is_active = 16;
  int32 display_order = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}
