syntax = "proto3";

package clinic.v1.types;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/arm-1234/protos/clinic/v1/types;types";

message OpeningHours {
  int32 weekday = 1;
  string opens_at = 2;
  string closes_at = 3;
  bool is_closed = 4;
}

message BranchInfo {
  string branch_id = 1;
  string slug = 2;
  string name = 3;
  string address_line1 = 4;
  string address_line2 = 5;
  string city = 6;
  string state = 7;
  string pincode = 8;
  string phone = 9;
  string email = 10;
  double latitude = 11;
  double longitude = 12;
  string google_maps_url = 13;
  repeated OpeningHours opening_hours = 14;
  string timezone = 15;
  bool is_active = 16;
  bool is_primary = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}
