syntax = "proto3";

package clinic.v1.types;

import "google/protobuf/timestamp.proto";
import "clinic/v1/types/enums/service_category.proto";
import "clinic/v1/types/enums/consultation_mode.proto";

option go_package = "github.com/arm-1234/protos/clinic/v1/types;types";

// A bookable service from the clinic's catalog, e.g. "Pure Tone Audiometry
// (PTA)" or "Voice & Swallowing Therapy".
message ServiceInfo {
  string service_id = 1;
  // URL-safe identifier used by the website, e.g. "pure-tone-audiometry".
  string slug = 2;
  string name = 3;
  // Clinical short form shown alongside the name, e.g. "PTA", "BERA".
  string short_code = 4;
  clinic.v1.types.enums.ServiceCategory category = 5;
  // One-line summary used on cards and listings.
  string summary = 6;
  // Long-form description rendered on the service detail page.
  string description = 7;
  // What the patient should expect during the session, one step per entry.
  repeated string preparation_steps = 8;
  int32 duration_minutes = 9;
  // Price in paise to avoid floating point rounding. Zero means "on request".
  int64 price_amount = 10;
  string currency = 11;
  repeated clinic.v1.types.enums.ConsultationMode supported_modes = 12;
  string image_url = 13;
  // Lucide icon name used by the frontend when no image is set.
  string icon = 14;
  // Whether the service is surfaced on the homepage.
  bool is_featured = 15;
  bool is_active = 16;
  // Ascending display order within a category.
  int32 display_order = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}
