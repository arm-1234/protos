syntax = "proto3";

package clinic.v1.types;

import "google/protobuf/timestamp.proto";
import "clinic/v1/types/enums/appointment_status.proto";
import "clinic/v1/types/enums/consultation_mode.proto";

option go_package = "github.com/arm-1234/protos/clinic/v1/types;types";

message SlotInfo {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
  bool is_available = 3;
  int32 remaining_capacity = 4;
}

message PatientDetails {
  string full_name = 1;
  string phone = 2;
  string email = 3;
  int32 age = 4;
  string gender = 5;
  string referred_by = 6;
  string notes = 7;
}

message AppointmentInfo {
  string appointment_id = 1;
  string reference_code = 2;
  string service_id = 3;
  string service_name = 4;
  string doctor_id = 5;
  string doctor_name = 6;
  string branch_id = 7;
  string branch_name = 8;
  PatientDetails patient = 9;
  google.protobuf.Timestamp scheduled_at = 10;
  int32 duration_minutes = 11;
  clinic.v1.types.enums.ConsultationMode mode = 12;
  clinic.v1.types.enums.AppointmentStatus status = 13;
  string staff_notes = 14;
  string cancellation_reason = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}
