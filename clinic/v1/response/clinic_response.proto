syntax = "proto3";

package clinic.v1.response;

import "clinic/v1/types/appointment.proto";
import "clinic/v1/types/branch.proto";
import "clinic/v1/types/doctor.proto";
import "clinic/v1/types/enquiry.proto";
import "clinic/v1/types/media.proto";
import "clinic/v1/types/review.proto";
import "clinic/v1/types/service.proto";
import "clinic/v1/types/enums/service_category.proto";

option go_package = "github.com/arm-1234/protos/clinic/v1/response;response";

message PageInfo {
  int64 page_number = 1;
  int64 page_size = 2;
  int64 total_pages = 3;
  int64 total_records = 4;
}

message ServiceCategoryGroup {
  clinic.v1.types.enums.ServiceCategory category = 1;
  string label = 2;
  repeated clinic.v1.types.ServiceInfo services = 3;
}

message ListServicesResponse {
  repeated clinic.v1.types.ServiceInfo services = 1;
  repeated ServiceCategoryGroup groups = 2;
  PageInfo page = 3;
}

message GetServiceResponse {
  clinic.v1.types.ServiceInfo service = 1;
  repeated clinic.v1.types.DoctorInfo doctors = 2;
  repeated clinic.v1.types.ServiceInfo related_services = 3;
  clinic.v1.types.RatingSummary rating_summary = 4;
}

message ListDoctorsResponse {
  repeated clinic.v1.types.DoctorInfo doctors = 1;
  PageInfo page = 2;
}

message GetDoctorResponse {
  clinic.v1.types.DoctorInfo doctor = 1;
  repeated clinic.v1.types.ServiceInfo services = 2;
  clinic.v1.types.RatingSummary rating_summary = 3;
  repeated clinic.v1.types.ReviewInfo recent_reviews = 4;
}

message ListBranchesResponse {
  repeated clinic.v1.types.BranchInfo branches = 1;
}

message ListAvailableSlotsResponse {
  string date = 1;
  string timezone = 2;
  repeated clinic.v1.types.SlotInfo slots = 3;
  bool is_closed = 4;
}

message BookAppointmentResponse {
  clinic.v1.types.AppointmentInfo appointment = 1;
  string reference_code = 2;
  string message = 3;
}

message GetAppointmentResponse {
  clinic.v1.types.AppointmentInfo appointment = 1;
}

message CancelAppointmentResponse {
  clinic.v1.types.AppointmentInfo appointment = 1;
  string message = 2;
}

message SubmitReviewResponse {
  clinic.v1.types.ReviewInfo review = 1;
  string message = 2;
}

message ListReviewsResponse {
  repeated clinic.v1.types.ReviewInfo reviews = 1;
  clinic.v1.types.RatingSummary rating_summary = 2;
  PageInfo page = 3;
}

message GetRatingSummaryResponse {
  clinic.v1.types.RatingSummary rating_summary = 1;
}

message ListMediaResponse {
  repeated clinic.v1.types.MediaInfo media = 1;
  repeated string albums = 2;
  PageInfo page = 3;
}

message MediaResponse {
  clinic.v1.types.MediaInfo media = 1;
}

message DeleteMediaResponse {
  bool success = 1;
}

message SubmitEnquiryResponse {
  clinic.v1.types.EnquiryInfo enquiry = 1;
  string message = 2;
}

message ListEnquiriesResponse {
  repeated clinic.v1.types.EnquiryInfo enquiries = 1;
  PageInfo page = 2;
}

message ResolveEnquiryResponse {
  clinic.v1.types.EnquiryInfo enquiry = 1;
}

message AdminProfile {
  string admin_id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
}

message AdminLoginResponse {
  string access_token = 1;
  int64 expires_in = 2;
  AdminProfile profile = 3;
}

message GetAdminProfileResponse {
  AdminProfile profile = 1;
}

message ListAppointmentsResponse {
  repeated clinic.v1.types.AppointmentInfo appointments = 1;
  PageInfo page = 2;
}

message AppointmentResponse {
  clinic.v1.types.AppointmentInfo appointment = 1;
}

message ListPendingReviewsResponse {
  repeated clinic.v1.types.ReviewInfo reviews = 1;
  PageInfo page = 2;
}

message ModerateReviewResponse {
  clinic.v1.types.ReviewInfo review = 1;
}

message UpsertServiceResponse {
  clinic.v1.types.ServiceInfo service = 1;
}

message DailyCount {
  string date = 1;
  int64 count = 2;
}

message GetDashboardStatsResponse {
  int64 total_appointments = 1;
  int64 appointments_today = 2;
  int64 appointments_upcoming = 3;
  int64 pending_reviews = 4;
  int64 unresolved_enquiries = 5;
  double average_rating = 6;
  int64 total_reviews = 7;
  repeated DailyCount appointments_trend = 8;
  repeated ServicePopularity top_services = 9;
}

message ServicePopularity {
  string service_id = 1;
  string service_name = 2;
  int64 booking_count = 3;
}

message DeleteServiceResponse {
  bool success = 1;
  bool soft_deleted = 2;
  bool permanently_deleted = 3;
  string message = 4;
}

message UpdateTimingsResponse {
  bool success = 1;
}

message UpdateContactResponse {
  bool success = 1;
}
