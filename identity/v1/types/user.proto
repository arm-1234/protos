syntax = "proto3";

package identity.v1.types;

import "google/protobuf/timestamp.proto";
import "identity/v1/types/enums/user_type.proto";

option go_package = "github.com/arm-1234/protos/identity/v1/types;types";

message UserInfo {
  string user_id = 1;
  identity.v1.types.enums.UserType user_type = 2;
  string name = 3;
  string phone = 4;
  string email = 5;
  string merchant_id = 6;
  string provider = 7;
  string external_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool verified = 11;
  // Email ownership proven by OTP. Gates gift redemption, so a throwaway
  // address cannot farm rewards.
  bool email_verified = 12;
  // True when a password is set. Lets the app show "log in with OTP" only for
  // accounts that have no password yet.
  bool has_password = 13;
}
