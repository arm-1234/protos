syntax = "proto3";

package clinic.v1.types;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/arm-1234/protos/clinic/v1/types;types";

message EnquiryInfo {
  string enquiry_id = 1;
  string full_name = 2;
  string phone = 3;
  string email = 4;
  string subject = 5;
  string message = 6;
  string source = 7;
  bool is_resolved = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
