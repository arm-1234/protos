syntax = "proto3";

package identity.v1.types.enums;

option go_package = "github.com/arm-1234/protos/identity/v1/types/enums;enums";

enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  USER_TYPE_USER = 1;
  USER_TYPE_MERCHANT = 2;
  // Staff account. Carried in the JWT so services can gate privileged RPCs
  // (creating competitions, reviewing flagged sessions) without a DB lookup.
  USER_TYPE_ADMIN = 3;
}
