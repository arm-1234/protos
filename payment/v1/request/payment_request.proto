syntax = "proto3";

package payment.v1.request;

import "google/api/field_behavior.proto";
import "validate/validate.proto";
import "payment/v1/types/enums/wallet.proto";

option go_package = "github.com/arm-1234/protos/payment/v1/request;request";

message InitiatePaymentRequest {
  string order_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string.min_len = 1
  ];
}

message VerifyPaymentRequest {
  string order_id = 1 [(validate.rules).string.min_len = 1];
  string payment_id = 2 [(validate.rules).string.min_len = 1];
  string provider_payment_id = 3 [(validate.rules).string.min_len = 1];
  string checkout_token = 4 [(validate.rules).string.min_len = 1];
}

message GetPaymentStatusRequest {
  string order_id = 1 [(validate.rules).string.min_len = 1];
  string payment_id = 2 [(validate.rules).string.min_len = 1];
}

message RequestInstantPayoutRequest {
  string order_id = 1 [(validate.rules).string.min_len = 1];
}

message GetPayoutRequest {
  string order_id = 1 [(validate.rules).string.min_len = 1];
}

message GetWalletRequest {
  string merchant_id = 1;
}

message ListWalletEntriesRequest {
  string merchant_id = 1;
  int64 page_number = 2;
  int64 page_size = 3 [(validate.rules).int64 = {gte: 0, lte: 100}];
}

message AddBankAccountRequest {
  string beneficiary_name = 1 [(validate.rules).string = {min_len: 2, max_len: 120}];
  string account_number = 2 [(validate.rules).string.max_len = 34];
  string ifsc = 3 [(validate.rules).string.max_len = 11];
  string vpa = 4 [(validate.rules).string.max_len = 320];
  payment.v1.types.enums.BankAccountKind kind = 5;
  bool make_primary = 6;
}

message ListBankAccountsRequest {}

message DeleteBankAccountRequest {
  string bank_account_id = 1 [(validate.rules).string.min_len = 1];
}

message RequestWithdrawalRequest {
  int64 amount_minor = 1 [(validate.rules).int64.gt = 0];
  string bank_account_id = 2 [(validate.rules).string.min_len = 1];
  string idempotency_key = 3 [(validate.rules).string = {min_len: 8, max_len: 64}];
}

message ListWithdrawalsRequest {
  int64 page_number = 1;
  int64 page_size = 2 [(validate.rules).int64 = {gte: 0, lte: 100}];
}

message GetWithdrawalRequest {
  string withdrawal_id = 1 [(validate.rules).string.min_len = 1];
}
