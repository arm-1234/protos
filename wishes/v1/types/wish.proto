syntax = "proto3";

package wishes.v1.types;

import "google/protobuf/timestamp.proto";
import "wishes/v1/types/enums/wish_status.proto";
import "wishes/v1/types/enums/delivery_status.proto";

option go_package = "github.com/arm-1234/protos/wishes/v1/types;types";

message WishState {
  google.protobuf.Timestamp first_open_at = 1;
  int64 open_count = 2;
  int64 response_count = 3;
  int64 unseen_response_count = 4;
  google.protobuf.Timestamp last_response_at = 5;
  wishes.v1.types.enums.DeliveryStatus delivery_status = 6;
  google.protobuf.Timestamp delivered_at = 7;
}

message WishInfo {
  string wish_id = 1;
  string card_id = 2;
  string owner_user_id = 3;
  string template = 4;
  string title = 5;
  wishes.v1.types.enums.WishStatus status = 6;
  string card_url = 7;
  string manage_url = 8;
  string from_label = 9;
  string to_email = 10;
  int32 expiry_days = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp expires_at = 14;
  google.protobuf.Timestamp revoked_at = 15;
  wishes.v1.types.WishState state = 16;
  string step = 17;
}
