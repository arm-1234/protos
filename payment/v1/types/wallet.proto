syntax = "proto3";

package payment.v1.types;

import "google/protobuf/timestamp.proto";
import "payment/v1/types/enums/wallet.proto";

option go_package = "github.com/arm-1234/protos/payment/v1/types;types";

message WalletBalance {
  string wallet_id = 1;
  payment.v1.types.enums.WalletOwnerType owner_type = 2;
  string owner_id = 3;
  string currency = 4;
  int64 pending_minor = 5;
  int64 available_minor = 6;
  int64 total_minor = 7;
  int64 lifetime_credited_minor = 8;
  int64 lifetime_withdrawn_minor = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message WalletEntry {
  string entry_id = 1;
  string wallet_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  payment.v1.types.enums.WalletEntryReason reason = 5;
  payment.v1.types.enums.WalletBalanceState state = 6;
  string reference_type = 7;
  string reference_id = 8;
  string note = 9;
  int64 balance_after_minor = 10;
  google.protobuf.Timestamp created_at = 11;
}

message BankAccount {
  string bank_account_id = 1;
  payment.v1.types.enums.WalletOwnerType owner_type = 2;
  string owner_id = 3;
  string beneficiary_name = 4;
  string account_last4 = 5;
  string ifsc = 6;
  string vpa = 7;
  payment.v1.types.enums.BankAccountKind kind = 8;
  bool is_primary = 9;
  bool is_verified = 10;
  google.protobuf.Timestamp created_at = 11;
}

message Withdrawal {
  string withdrawal_id = 1;
  string wallet_id = 2;
  string bank_account_id = 3;
  int64 amount_minor = 4;
  string currency = 5;
  payment.v1.types.enums.WithdrawalStatus status = 6;
  string provider_ref = 7;
  string failure_reason = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}
