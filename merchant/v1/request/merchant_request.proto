syntax = "proto3";

package merchant.v1.request;

import "google/api/field_behavior.proto";
import "validate/validate.proto";
import "merchant/v1/types/store_hours.proto";

option go_package = "github.com/arm-1234/protos/merchant/v1/request;request";

message OnboardMerchantRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string.min_len = 1
  ];
  string phone = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {min_len: 8, max_len: 15}
  ];
  string store_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string.min_len = 1
  ];
  string description = 4;
  string logo_url = 5;
  string address = 6;
  // Optional: blank means the backend generates a store address.
  string upi_vpa = 7 [(validate.rules).string = {
    ignore_empty: true,
    pattern: "^[a-zA-Z0-9.\\-_]{2,256}@[a-zA-Z]{2,64}$"
  }];
  double latitude = 8 [(validate.rules).double = {gte: -90, lte: 90}];
  double longitude = 9 [(validate.rules).double = {gte: -180, lte: 180}];
  double max_order_distance_m = 10 [(validate.rules).double = {gte: 0, lte: 100000}];
}

message GetMerchantRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
}

message UpdateMerchantRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
  string name = 2;
  string store_name = 3;
  string description = 4;
  string logo_url = 5;
  string address = 6;
  double latitude = 8 [(validate.rules).double = {gte: -90, lte: 90}];
  double longitude = 9 [(validate.rules).double = {gte: -180, lte: 180}];
  optional double max_order_distance_m = 10 [(validate.rules).double = {gte: 0, lte: 100000}];
  // Emailed code, required only when location or order radius changes.
  string code = 11 [(validate.rules).string = {ignore_empty: true, min_len: 4, max_len: 10}];
}

message RequestStoreUpdateOtpRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
}

// Replaces the whole weekly schedule: send every open day. An empty list clears
// the schedule, which leaves the store always orderable.
message SetStoreHoursRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
  repeated merchant.v1.types.DayHours days = 2 [(validate.rules).repeated = {max_items: 7}];
}

// The manual switch. Closing pauses orders until the next scheduled opening;
// opening clears an active pause.
message SetStoreOpenRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
  bool open = 2;
}

message ResolveStoreByVpaRequest {
  string vpa = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string.min_len = 3
  ];
}

message ListMerchantVpasRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
}

message AddMerchantVpaRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
  string vpa = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string.pattern = "^[a-zA-Z0-9.\\-_]{2,256}@[a-zA-Z]{2,64}$"
  ];
  string label = 3;
  bool make_primary = 4;
}

message RemoveMerchantVpaRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
  string vpa_id = 2 [(validate.rules).string.min_len = 1];
}

message SetPrimaryMerchantVpaRequest {
  string merchant_id = 1 [(validate.rules).string.min_len = 1];
  string vpa_id = 2 [(validate.rules).string.min_len = 1];
}

message DiscoverStoresRequest {
  double latitude = 1;
  double longitude = 2;
  double radius_m = 3 [(validate.rules).double = {gte: 0, lte: 100000}];
  string query = 4 [(validate.rules).string = {ignore_empty: true, max_len: 128}];
  int32 page_size = 5 [(validate.rules).int32 = {gte: 0, lte: 100}];
  int32 page = 6 [(validate.rules).int32.gte = 0];
}
