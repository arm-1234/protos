syntax = "proto3";

package feedback.v1.response;

import "feedback/v1/types/category.proto";

option go_package = "github.com/arm-1234/protos/feedback/v1/response;response";

message ListFeedbackCategoriesResponse {
  repeated feedback.v1.types.FeedbackCategory categories = 1;
}

message SubmitFeedbackResponse {
  bool received = 1;
}
