syntax = "proto3";

package wishes.v1.request;

import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "validate/validate.proto";
import "wishes/v1/types/enums/wish_status.proto";
import "wishes/v1/types/enums/wish_sort_by.proto";
import "wishes/v1/types/enums/response_kind.proto";

option go_package = "github.com/arm-1234/protos/wishes/v1/request;request";

message CreateWishRequest {
  string template = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 2, max_len: 64, pattern: "^[a-z][a-z0-9-]*$"}];
  google.protobuf.Struct config = 2;
  int32 expiry_days = 3 [(validate.rules).int32 = {ignore_empty: true, gte: 1, lte: 14}];
  string from_label = 4 [(validate.rules).string = {ignore_empty: true, max_len: 128}];
  string to_email = 5 [(validate.rules).string = {ignore_empty: true, email: true}];
}

message ListMyWishesRequest {
  repeated wishes.v1.types.enums.WishStatus statuses = 1;
  string template = 2 [(validate.rules).string = {ignore_empty: true, max_len: 64}];
  wishes.v1.types.enums.WishSortBy sort_by = 3;
  int64 page_number = 4;
  int64 page_size = 5 [(validate.rules).int64 = {ignore_empty: true, lte: 100}];
}

message GetWishRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
}

message UpdateWishRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
  google.protobuf.Struct config = 2;
}

message ExtendWishRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
  int32 expiry_days = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).int32 = {gte: 1, lte: 14}];
}

message RevokeWishRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
}

message SendWishRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
  string to_email = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.email = true];
  string from_label = 3 [(validate.rules).string = {ignore_empty: true, max_len: 128}];
}

message ListWishResponsesRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
  int64 page_number = 2;
  int64 page_size = 3 [(validate.rules).int64 = {ignore_empty: true, lte: 100}];
}

message MarkResponsesSeenRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
}

message GetWishStatsRequest {}

message ListTemplatesRequest {}

message SaveDraftRequest {
  string wish_id = 1 [(validate.rules).string = {ignore_empty: true, max_len: 64}];
  string template = 2 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 2, max_len: 64, pattern: "^[a-z][a-z0-9-]*$"}];
  google.protobuf.Struct config = 3;
  int32 expiry_days = 4 [(validate.rules).int32 = {ignore_empty: true, gte: 1, lte: 14}];
  string from_label = 5 [(validate.rules).string = {ignore_empty: true, max_len: 128}];
  string to_email = 6 [(validate.rules).string = {ignore_empty: true, email: true}];
  string step = 7 [(validate.rules).string = {ignore_empty: true, max_len: 64}];
}

message PublishWishRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
}

message DeleteWishRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
}

message UploadWishPhotoRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
  int32 idx = 2 [(validate.rules).int32 = {gte: 0, lte: 2}];
  string data_url = 3 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 32, max_len: 700000}];
  int32 width = 4;
  int32 height = 5;
}

message DeleteWishPhotoRequest {
  string wish_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string.min_len = 1];
  int32 idx = 2 [(validate.rules).int32 = {gte: 0, lte: 2}];
}

message SubmitResponseRequest {
  string card_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 6, max_len: 64}];
  wishes.v1.types.enums.ResponseKind kind = 2 [(google.api.field_behavior) = REQUIRED];
  string value = 3 [(validate.rules).string = {ignore_empty: true, max_len: 64}];
  string message = 4 [(validate.rules).string = {ignore_empty: true, max_len: 400}];
}

message ReportCardRequest {
  string card_id = 1 [(google.api.field_behavior) = REQUIRED, (validate.rules).string = {min_len: 6, max_len: 64}];
  string reason = 2 [(validate.rules).string = {ignore_empty: true, max_len: 1000}];
  string reporter = 3 [(validate.rules).string = {ignore_empty: true, max_len: 320}];
}

message GetTemplateSchemaRequest {}
