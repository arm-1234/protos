syntax = "proto3";

package fitness.v1.types;

import "google/protobuf/timestamp.proto";
import "fitness/v1/types/enums/points_reason.proto";
import "fitness/v1/types/enums/redemption_status.proto";
import "fitness/v1/types/enums/gift_status.proto";

option go_package = "github.com/arm-1234/protos/fitness/v1/types;types";

message PointsLedgerEntry {
  string entry_id = 1;
  string user_id = 2;
  int64 delta = 3;
  int64 balance_after = 4;
  fitness.v1.types.enums.PointsReason reason = 5;
  string reference_id = 6;
  string description = 7;
  bool is_reversible = 8;
  google.protobuf.Timestamp reversible_until = 9;
  string reverses_entry_id = 10;
  google.protobuf.Timestamp created_at = 11;
}

message PointsBalance {
  string user_id = 1;
  int64 available_points = 2;
  int64 reserved_points = 3;
  int64 total_points = 4;
  int64 lifetime_earned = 5;
  int64 lifetime_redeemed = 6;
  int64 pending_points = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GiftInfo {
  string gift_id = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
  int64 points_cost = 5;
  fitness.v1.types.enums.GiftStatus status = 6;
  int64 stock_remaining = 7;
  int32 per_user_limit = 8;
  string category = 9;
  string state_code = 10;
  google.protobuf.Timestamp available_until = 11;
  bool can_afford = 12;
  google.protobuf.Timestamp created_at = 13;
}

message RedemptionInfo {
  string redemption_id = 1;
  string user_id = 2;
  string gift_id = 3;
  string gift_title = 4;
  string gift_image_url = 5;
  int64 points_spent = 6;
  fitness.v1.types.enums.RedemptionStatus status = 7;
  string fulfilment_code = 8;
  string fulfilment_note = 9;
  string rejection_reason = 10;
  google.protobuf.Timestamp requested_at = 11;
  google.protobuf.Timestamp fulfilled_at = 12;
}
